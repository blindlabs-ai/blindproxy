[package]
name = "zero-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/blindlabs-ai/zero-proxy"
description = "Zero-dependency, zero-spill HTTP/1.1 + TLS 1.3 + ACME v2 reverse proxy, hybrid PQ channel binding, and pure-Rust XDP/eBPF packet filter"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
