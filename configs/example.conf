# Zero-Proxy example configuration (general-purpose HTTP/1.1 reverse proxy)
#
# Run locally:
#   zero-proxy --config configs/example.conf

listen = 127.0.0.1:8080
max_body = 1048576
max_header_bytes = 16384
header_timeout_ms = 5000
idle_timeout_ms = 30000
upstream_timeout_ms = 10000
drain_timeout_ms = 10000

rps = 100
burst = 150
shards = 4096
max_connections = 1024
max_conns_per_ip = 64

# Prefix routing (longest prefix wins; "upstream" is an alias for "route")
route = /api/=127.0.0.1:9001
route = /=127.0.0.1:9000

# Optional per-route body limit and static asset CORS prefix
route_max_body = /api/=262144
static_cors_prefix = /static

# ----------------------------------------------------------------------------
# Optional TLS 1.3 + RFC 8555 ACME v2 production configuration (uncomment):
# ----------------------------------------------------------------------------
